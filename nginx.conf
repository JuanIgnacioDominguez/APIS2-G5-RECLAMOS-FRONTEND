server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets on the fly.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints asset filenames, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or clients keep an old bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: serve index.html for any unknown path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
