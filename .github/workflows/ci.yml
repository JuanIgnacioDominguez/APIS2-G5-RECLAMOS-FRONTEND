name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"

jobs:
  lint-and-test:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint (lint)
        run: npm run lint

      - name: Prettier (format)
        run: npm run format:check

      # The coverage gate is 60%, the threshold required by the course rubric.
      # It is enforced by vitest (see thresholds in vite.config.ts).
      - name: Tests + coverage
        run: npm run test:cov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The production build must typecheck and bundle cleanly, not only pass tests.
      - name: Build
        run: npm run build

  sonarcloud:
    name: SonarCloud
    needs: lint-and-test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarCloud needs full history for accurate new-code and blame.
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage

      # Quality gate: bugs, vulnerabilities, code smells and the coverage from
      # the previous job. Runs only once SONAR_TOKEN is configured, so the CI
      # stays green until SonarCloud is set up (see README).
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image must build end to end (npm ci + vite build + nginx stage),
      # not only the local `npm run build`.
      - name: Build image
        run: docker build -t citypass-reclamos-frontend:${{ github.sha }} .
