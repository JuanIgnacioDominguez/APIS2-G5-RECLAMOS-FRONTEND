# SonarCloud configuration for the frontend.
# projectKey y organization los asigna SonarCloud al importar el repo de GitHub;
# ajustalos si tu organizacion usa otros valores.
sonar.projectKey=JuanIgnacioDominguez_APIS2-G5-RECLAMOS-FRONTEND
sonar.organization=juanignaciodominguez

# Codigo fuente y tests (los .test.* se analizan como tests, no como fuente).
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx

# Entrypoints y tipos sin logica ejecutable.
sonar.exclusions=src/main.tsx,src/vite-env.d.ts,dist/**,coverage/**
sonar.coverage.exclusions=src/**/*.test.*,src/test/**,src/theme/**,src/api/types.ts,src/App.tsx,src/main.tsx,src/vite-env.d.ts

# Reporte de cobertura generado por Vitest (job Lint + tests).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
